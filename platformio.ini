; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanorp2040connect]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
; earlephilhower board with the Nano RP2040 Connect pinout (D2 = GPIO25, A4/A5 = I2C, ...).
; "pico" would map D<N> to GPIO<N>, which doesn't match the Nano labels.
board = arduino_nano_connect
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
; Serial debug prints (see include/debug_print.h): SERIAL_DEBUG enables everything,
; or use SERIAL_DEBUG_ERRORS / SERIAL_DEBUG_INFO / SERIAL_DEBUG_DATA / SERIAL_DEBUG_COMMANDS alone.
; Remove for the flight build (SERIAL_DEBUG_COMMANDS can change the flight state!).
; BENCH_TEST runs only the sensors set up in bench_setup() (see src/bench/bench_setup.cpp), without flight state changes.
; Remove it for the flight build.
build_flags = -DSERIAL_DEBUG -DBENCH_TEST
lib_deps = 
	mikalhart/TinyGPSPlus@^1.1.0
	arduino-libraries/Arduino_LSM6DSOX@^1.1.2
	arduino-libraries/SD@^1.3.0
	porrey/MAX1704X@^1.2.8
	jgromes/RadioLib@^7.8.1
	adafruit/Adafruit MLX90640@^1.1.2
