; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; One env per firmware, pick it with "pio run -e <name>" or the env selector in the VS Code status bar:
; - sat:       flight firmware of the satellite (src/main.cpp)
; - sat_bench: same firmware, but runs only the sensors set up in src/bench/bench_setup.cpp,
;              without flight state changes, and with every debug print and command
; - ground:    ground station (src/ground/), receives the LoRa packets
; build_src_filter picks the files of each firmware, so only one setup()/loop() gets compiled.

[platformio]
default_envs = sat_bench

; Shared by every env
[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
; earlephilhower board with the Nano RP2040 Connect pinout (D2 = GPIO25, A4/A5 = I2C, ...).
; "pico" would map D<N> to GPIO<N>, which doesn't match the Nano labels.
board = arduino_nano_connect
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m

; Every library in lib_deps gets compiled, even if no file of the env includes it:
; each env lists only the ones its firmware uses
[libs]
lora = jgromes/RadioLib@^7.8.1
sat =
	mikalhart/TinyGPSPlus@^1.1.0
	arduino-libraries/Arduino_LSM6DSOX@^1.1.2
	arduino-libraries/SD@^1.3.0
	porrey/MAX1704X@^1.2.8
	adafruit/Adafruit MLX90640@^1.1.2
	${libs.lora}

; Serial debug prints (see include/debug_print.h): SERIAL_DEBUG enables everything,
; or use SERIAL_DEBUG_ERRORS / SERIAL_DEBUG_INFO / SERIAL_DEBUG_DATA / SERIAL_DEBUG_COMMANDS alone.
; Never add SERIAL_DEBUG / SERIAL_DEBUG_COMMANDS to sat: the commands can change the flight state!

[env:sat]
lib_deps = ${libs.sat}
build_src_filter = +<*> -<ground/> -<bench/>

[env:sat_bench]
lib_deps = ${libs.sat}
build_flags = -DSERIAL_DEBUG -DBENCH_TEST
build_src_filter = +<*> -<ground/>

; Only LoRa and the Serial prints, none of the satellite tasks / sensors
[env:ground]
lib_deps = ${libs.lora}
build_flags = -DSERIAL_DEBUG_ERRORS -DSERIAL_DEBUG_INFO
build_src_filter =
	-<*>
	+<ground/>
	+<driver/lora_drivers.cpp>
	+<utils/arduino_wrapper.cpp>
	+<utils/serial_print_types.cpp>
